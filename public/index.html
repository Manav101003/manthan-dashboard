<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mathan Institute of Career Development - Complete Management System for Students, Teachers, Fees, Attendance and more">
    <meta name="theme-color" content="#060a13">
    <title>Mathan Institute of Career Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                        <h1>Mathan Institute</h1>
                        <p>of Career Development</p>
                    </div>
                </div>
                <form id="loginForm" class="login-form">
                    <div class="role-selector">
                        <button type="button" class="role-btn active" data-role="admin"><i class="fas fa-user-shield"></i> Admin</button>
                        <button type="button" class="role-btn" data-role="teacher"><i class="fas fa-chalkboard-teacher"></i> Teacher</button>
                        <button type="button" class="role-btn" data-role="student"><i class="fas fa-user-graduate"></i> Student</button>
                    </div>
                    <input type="hidden" id="loginRole" value="admin">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                    <div id="loginError" class="login-error"></div>
                    <div class="login-hint">
                        <small>Demo: admin/admin123 | rajesh/teacher123 | aarav/student123</small>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="main-app hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Mathan Institute</span>
                </div>
                <button id="sidebarToggle" class="sidebar-toggle"><i class="fas fa-bars"></i></button>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Populated by JS based on role -->
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar"><i class="fas fa-user"></i></div>
                    <div class="user-details">
                        <span id="userName" class="user-name">Admin</span>
                        <span id="userRole" class="user-role">Administrator</span>
                    </div>
                </div>
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button id="mobileMenuBtn" class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                    <div class="breadcrumb">
                        <span id="pageTitle">Dashboard</span>
                    </div>
                </div>
                <div class="top-bar-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="globalSearch" placeholder="Search...">
                    </div>
                    <div class="notification-bell" id="notificationBell">
                        <i class="fas fa-bell"></i>
                        <span class="badge" id="notifBadge">0</span>
                    </div>
                    <div class="top-bar-date">
                        <i class="fas fa-calendar-alt"></i>
                        <span id="currentDate"></span>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Dynamically loaded content -->
            </div>
        </main>
    </div>

    <!-- Notification Panel -->
    <div id="notifPanel" class="notif-panel hidden">
        <div class="notif-header">
            <h3><i class="fas fa-bell"></i> Notifications</h3>
            <button onclick="document.getElementById('notifPanel').classList.add('hidden')"><i class="fas fa-times"></i></button>
        </div>
        <div id="notifList" class="notif-list"></div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="bundle.js"></script>
</body>
</html>
